<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>유보금 정산 — SJ Hub CA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-settlement-mode="reserve">
<header class="admin-mobile-header"><span class="admin-mobile-header__logo">SJ Hub</span><button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button></header>
<div class="admin-overlay" id="adminOverlay"></div>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar" data-role="ca"></aside>
  <main class="admin-main settlement-page settlement-page--wide">
    <h1 class="admin-page-title">유보금 정산</h1>
    <div class="settlement-section-title">오늘의 유보금 정보</div>
    <div class="settlement-kpi-grid" id="settlementKpiGrid"></div>

    <div class="settlement-filter-line reserve-filter">
      <label>적용 기간</label>
      <input type="date" id="fApplyFrom" value="2026-07-01" />
      <span>~</span>
      <input type="date" id="fApplyTo" value="2026-07-31" />
      <input type="date" id="fDueDate" title="차감 예정일" />
      <select id="fTargetType"><option value="">대상 유형 전체</option><option>지사</option><option>총판</option><option>영업</option><option>대리점</option></select>
      <input type="text" id="fTargetName" placeholder="대상명" />
      <select id="fReserveStatus"><option value="">상태 전체</option><option>적용 예정</option><option>적용 중</option><option>차감 예정</option><option>차감 완료</option><option>반환 완료</option><option>해제</option></select>
      <select id="fMethod"><option value="">설정 방식 전체</option><option>정액</option><option>정률</option></select>
      <button type="button" class="admin-btn admin-btn--primary admin-btn--sm" id="searchBtn">검색</button>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="resetBtn">초기화</button>
    </div>

    <div class="settlement-actions-line">
      <div class="settlement-actions-line__left">
        <button type="button" class="admin-btn admin-btn--primary admin-btn--sm" id="reserveAddBtn">유보금 등록</button>
      </div>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="downloadBtn">엑셀 다운로드</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table settlement-table" style="min-width:1320px;">
        <thead><tr><th><input type="checkbox" /></th><th>유보금 번호</th><th>대상 유형</th><th>대상명</th><th>연결 조직</th><th>설정 방식</th><th>설정값</th><th class="text-right">최초 유보금</th><th class="text-right">현재 유보금</th><th>적용일</th><th>차감 예정일</th><th>D-day</th><th>상태</th><th>상세 내역</th></tr></thead>
        <tbody id="reserveTableBody"></tbody>
      </table>
    </div>
  </main>
</div>
<script src="shared.js"></script>
<script src="settlement-pages.js"></script>
</body>
</html>
