<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMS 발송내역 관리 — link it 어드민</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="sms-payment.css"></head><body>
<header class="admin-mobile-header"><span class="admin-mobile-header__logo">link it</span><button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button></header>
<div class="admin-overlay" id="adminOverlay"></div><div class="admin-layout"><aside class="admin-sidebar" id="adminSidebar"></aside><main class="admin-main"><div class="sms-page">

<div class="sms-head"><div><h1>SMS 발송내역 관리</h1><p>전송 시도별 결과와 전송완료 여부를 확인합니다.</p></div><a class="admin-btn admin-btn--outline" href="sms-payment-create.html">결제 요청</a></div>
<div class="sms-banner">전송완료는 사업자의 최종 전달 성공 결과를 받은 경우에만 표시됩니다. 접수 성공은 전송 중이며, 확인 불가 응답은 확인 중입니다.</div>
<div class="sms-kpis"><div class="sms-kpi"><span>검색 결과</span><strong data-tally="total">0</strong></div><div class="sms-kpi"><span>전송완료</span><strong data-tally="success">0</strong></div><div class="sms-kpi"><span>전송실패</span><strong data-tally="fail">0</strong></div><div class="sms-kpi"><span>전송 중</span><strong data-tally="pending">0</strong></div><div class="sms-kpi"><span>확인 중</span><strong data-tally="checking">0</strong></div></div>
<section class="sms-card"><div class="sms-search">
<label>발송일자<input type="date" id="smsSendDate"></label>
<label>상점<select id="smsMessageBa"><option value="">전체 상점</option><option value="ba-demo-01">모노데이</option><option value="ba-demo-02">루미에르</option><option value="ba-demo-03">온더테이블</option></select></label>
<label>전송 상태<select id="smsMessageState"><option value="">전체 상태</option><option>전송완료</option><option>전송실패</option><option>전송 중</option><option>확인 중</option></select></label>
<label>검색 기준<select id="smsMessageSearchType"><option value="all">전체</option><option value="id">요청번호/발송 ID</option><option value="phone">수신번호</option><option value="product">상품명</option></select></label>
<label style="grid-column:span 2">검색어<input id="smsMessageQuery" type="search" placeholder="요청번호, 발송 ID, 수신번호, 상품명"></label>
<div class="sms-search__actions"><button class="admin-btn admin-btn--primary" id="smsMessageSearchBtn" type="button">검색</button><button class="admin-btn admin-btn--outline" id="smsMessageResetBtn" type="button">초기화</button></div>
</div></section>
<section class="sms-card"><div class="sms-summary"><span>검색 결과 <strong id="smsMessageCount">0건</strong></span><button class="admin-btn admin-btn--outline admin-btn--sm" id="smsMessageRefreshBtn" type="button">결과 새로고침</button></div><div class="sms-table-wrap"><table class="sms-table"><thead><tr><th>발송 ID</th><th>요청번호</th><th>상점 이름</th><th>상품명</th><th>수신번호</th><th>대표번호</th><th>종류</th><th>발송 구분</th><th>발송일시</th><th>전송 상태</th><th>완료일시</th><th>실패 사유</th></tr></thead><tbody id="smsMessageRows"></tbody></table></div><div class="sms-pager">최신순 · 페이지당 20건 · 샘플 발송 결과 포함</div></section>
</div></main></div><div class="sms-toast" role="status"></div><script src="admin.js"></script><script src="sms-payment.js"></script></body></html>
