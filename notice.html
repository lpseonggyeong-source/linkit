<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 — link it 어드민</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- 모바일 헤더 -->
<header class="admin-mobile-header">
  <span class="admin-mobile-header__logo">link it</span>
  <button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="admin-overlay" id="adminOverlay"></div>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <h1 class="admin-page-title t-title-1-md">공지사항</h1>

    <!-- ── 목록 뷰 ── -->
    <div id="noticeListView">

      <!-- 검색 영역 -->
      <div class="admin-notice-search-bar">
        <input type="text" id="noticeSearchInput"
          class="admin-order-search-input"
          placeholder="키워드 검색"
          aria-label="키워드 검색" />
        <button type="button" id="noticeSearchBtn"
          class="admin-order-btn admin-order-btn--primary">검색</button>
      </div>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table" id="noticeTable">
            <thead>
              <tr>
                <th scope="col" class="admin-notice-col-num">번호</th>
                <th scope="col" style="text-align:left;">제목</th>
                <th scope="col" class="admin-notice-col-author">작성자</th>
                <th scope="col" class="admin-notice-col-date">등록일</th>
              </tr>
            </thead>
            <tbody id="noticeTableBody"></tbody>
          </table>
        </div>

        <div class="admin-pagination" id="noticePagination" aria-label="페이지 네비게이션"></div>

      </div>
    </div><!-- /noticeListView -->

    <!-- ── 상세 뷰 ── -->
    <div id="noticeDetailView" style="display:none;">
      <article class="admin-card admin-notice-detail">

        <div class="admin-notice-detail-header">
          <span id="noticeDetailBadge"></span>
          <h2 class="admin-notice-detail-title" id="noticeDetailTitle"></h2>
        </div>

        <div class="admin-notice-meta">
          <span class="admin-notice-meta__author" id="noticeDetailAuthor"></span>
          <span id="noticeDetailDate"></span>
        </div>

        <div class="admin-notice-content" id="noticeDetailContent"></div>

        <div class="admin-notice-back">
          <a href="notice.html" class="admin-btn admin-btn--outline">목록보기</a>
        </div>

        <nav class="admin-notice-nav" id="noticeNav" aria-label="이전글 다음글 네비게이션"></nav>

      </article>
    </div><!-- /noticeDetailView -->

  </main>
</div>

<script>
window.MOCK_NOTICES = [
  { id: 1, title: "서비스 점검 안내(5/30)", author: "링크잇", date: "2026-05-23", time: "12:00", isImportant: false, content: "안녕하세요. 링크잇입니다.\n보다 안정적인 서비스 제공을 위해 아래와 같이 시스템 점검을 진행할 예정입니다.\n\n■ 점검 일정: 2026년 05월 30일(토) 23:00 ~ 23:59 (약 1시간)\n■ 점검 대상: 전체 서비스\n■ 점검 내용: 서버 안정화 및 기능 업데이트\n\n점검 시간 동안 서비스 이용이 제한될 수 있으니 양해 부탁드립니다.\n더 나은 서비스로 보답하겠습니다.\n\n감사합니다." },
  { id: 2, title: "서비스 안정화를 위한 시스템 점검 안내드립니다", author: "링크잇", date: "2026-05-20", time: "10:00", isImportant: true, content: "안녕하세요. 링크잇입니다.\n보다 안정적인 서비스 제공을 위해 아래와 같이 긴급 시스템 점검을 진행합니다.\n\n■ 점검 일정: 2026년 05월 20일(수) 10:00 ~ 11:00 (약 1시간)\n■ 점검 대상: 전체 서비스\n■ 점검 내용: 서버 성능 개선 및 긴급 패치 적용\n\n중요 공지: 해당 점검은 서비스 안정화를 위한 필수 작업으로, 점검 시간 준수를 부탁드립니다.\n이용에 불편을 드려 죄송합니다.\n\n감사합니다." },
  { id: 3, title: "고객님의 더욱 편리한 쇼핑 경험을 위해 모바일 앱 기능이 새롭게 개선되었습니다(2026/05/01기준)", author: "관리자", date: "2026-05-01", time: "00:05", isImportant: false, content: "안녕하세요. 링크잇입니다.\n고객님의 더욱 편리한 쇼핑 경험을 위해 모바일 앱이 새롭게 업데이트되었습니다.\n\n■ 업데이트 버전: v3.2.0\n■ 업데이트 일시: 2026-05-01 00:05\n■ 주요 변경 사항\n  - 상품 상세 페이지 이미지 슬라이더 개선\n  - 장바구니 UX 개선 및 속도 향상\n  - 결제 프로세스 안정성 향상\n  - 기타 버그 수정\n\n앱스토어 및 구글플레이에서 최신 버전으로 업데이트하시면 이용 가능합니다.\n감사합니다." },
  { id: 4, title: "보다 편리한 쇼핑 경험을 위한 앱 업데이트가 진행되었습니다", author: "링크잇", date: "2026-04-30", time: "16:03", isImportant: false, content: "안녕하세요. 링크잇입니다.\n보다 편리한 쇼핑 경험을 위한 앱 업데이트가 진행되었습니다.\n\n■ 업데이트 버전: v3.1.5\n■ 업데이트 일시: 2026-04-30\n■ 주요 변경 사항\n  - 검색 기능 개선\n  - 찜하기 기능 안정성 향상\n  - 기타 UI/UX 개선\n\n자동 업데이트가 지원되지 않는 경우 앱스토어에서 직접 업데이트해 주세요.\n감사합니다." },
  { id: 5, title: "보다 편리한 쇼핑 경험을 위한 앱 업데이트가 진행되었습니다", author: "링크잇", date: "2026-04-27", time: "18:00", isImportant: false, content: "안녕하세요. 링크잇입니다.\n더 나은 사용자 경험을 위해 앱 업데이트가 진행되었습니다.\n\n■ 업데이트 버전: v3.1.4\n■ 업데이트 일시: 2026-04-27\n■ 주요 변경 사항\n  - 알림 기능 개선\n  - 로그인 프로세스 안정화\n  - 성능 최적화\n\n감사합니다." },
  { id: 6, title: "서비스 점검 안내(4/30)", author: "링크잇", date: "2026-04-20", time: "16:03", isImportant: false, content: "안녕하세요. 링크잇입니다.\n아래와 같이 서비스 점검을 진행할 예정입니다.\n\n■ 점검 일정: 2026년 04월 30일(목) 23:00 ~ 23:59 (약 1시간)\n■ 점검 대상: 전체 서비스\n■ 점검 내용: 서버 안정화 작업\n\n점검 시간 동안 서비스 이용이 일시 제한됩니다.\n이용에 불편을 드려 죄송합니다.\n\n감사합니다." },
  { id: 7, title: "모바일 앱 기능이 새롭게 개선되었습니다(2026/04/01기준)", author: "링크잇", date: "2026-03-30", time: "00:03", isImportant: false, content: "안녕하세요. 링크잇입니다.\n2026년 4월 1일 기준으로 모바일 앱 기능이 새롭게 개선되었습니다.\n\n■ 주요 변경 사항\n  - 홈 화면 개편 (개인화 추천 기능 추가)\n  - 쿠폰 및 포인트 UI 개선\n  - 배송 조회 기능 강화\n  - 접근성 개선 (시각 장애 지원)\n\n더욱 편리해진 링크잇 앱을 이용해 주세요.\n감사합니다." },
  { id: 8, title: "서비스 점검 안내", author: "링크잇", date: "2026-03-22", time: "10:03", isImportant: false, content: "안녕하세요. 링크잇입니다.\n아래와 같이 정기 서비스 점검을 진행합니다.\n\n■ 점검 일정: 2026년 03월 22일(일) 10:03 ~ 11:03 (약 1시간)\n■ 점검 대상: 전체 서비스\n■ 점검 내용: 정기 유지보수 및 보안 패치\n\n이용에 불편을 드려 죄송합니다.\n감사합니다." },
  { id: 9, title: "서비스 점검 안내(3/30)", author: "관리자", date: "2026-03-20", time: "16:03", isImportant: false, content: "안녕하세요. 링크잇입니다.\n아래와 같이 서비스 점검을 진행할 예정입니다.\n\n■ 점검 일정: 2026년 03월 30일(월) 23:00 ~ 23:59 (약 1시간)\n■ 점검 대상: 전체 서비스\n■ 점검 내용: 3월 말 정기 점검 및 기능 업데이트\n\n감사합니다." },
  { id: 10, title: "안정적인 서비스 제공을 위한 서버 이전 작업 안내", author: "관리자", date: "2026-03-15", time: "09:03", isImportant: false, content: "안녕하세요. 링크잇 운영팀입니다.\n안정적인 서비스 제공을 위한 서버 이전 작업을 아래와 같이 진행합니다.\n\n■ 작업 일시: 2026년 03월 15일(일) 09:03 ~ 11:03 (약 2시간)\n■ 영향 범위: 전체 서비스\n■ 작업 내용: 서버 인프라 이전 및 네트워크 성능 개선\n\n작업 시간 동안 일시적으로 서비스 접속이 불가할 수 있습니다.\n불편을 드려 죄송하며, 보다 빠르고 안정적인 서비스로 보답하겠습니다.\n\n감사합니다." },
  { id: 11, title: "링크잇 서비스 이용 약관 개정 안내", author: "링크잇", date: "2026-02-28", time: "09:00", isImportant: false, content: "안녕하세요. 링크잇입니다.\n2026년 3월 1일부터 링크잇 서비스 이용 약관이 개정됩니다.\n\n■ 시행 일자: 2026년 03월 01일\n■ 주요 변경 내용\n  - 제7조 (서비스 이용 범위) 일부 개정\n  - 제12조 (개인정보 처리) 항목 추가\n  - 제15조 (분쟁 해결) 조항 명확화\n\n변경된 약관은 링크잇 앱 내 '설정 > 이용약관'에서 확인하실 수 있습니다.\n\n감사합니다." },
  { id: 12, title: "개인정보 처리방침 변경 안내", author: "링크잇", date: "2026-02-10", time: "09:00", isImportant: false, content: "안녕하세요. 링크잇입니다.\n개인정보 보호법 개정에 따라 개인정보 처리방침이 아래와 같이 변경됩니다.\n\n■ 시행 일자: 2026년 02월 15일\n■ 주요 변경 내용\n  - 수집하는 개인정보 항목 명확화\n  - 개인정보 보유 기간 세분화\n  - 이용자 권리 행사 절차 구체화\n\n변경된 처리방침은 링크잇 홈페이지 및 앱 내에서 확인하실 수 있습니다.\n궁금한 사항은 고객센터로 문의해 주세요.\n\n감사합니다." }
];
</script>

</body>
</html>
