<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대리점 정산 (개선판) — SJ Hub CA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../shared.css" />
<link rel="stylesheet" href="settlement-v2.css" />
</head>
<body data-v2-mode="list" data-v2-type="brand">
<header class="admin-mobile-header"><span class="admin-mobile-header__logo">SJ Hub</span><button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button></header>
<div class="admin-overlay" id="adminOverlay"></div>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar" data-role="ca"></aside>
  <main class="admin-main settlement-page settlement-page--wide">
    <h1 class="admin-page-title" id="pageTitle">대리점 정산</h1>

    <div id="cyclePanel"></div>

    <div class="settlement-section-title">기준일 정산 정보</div>
    <div class="v2-kpi-note">거래(건) 단위 집계 — 상세 페이지의 정산 상태와 항상 일치합니다</div>
    <div class="settlement-kpi-grid" id="settlementKpiGrid"></div>

    <div class="settlement-filter-line">
      <label>필터<span class="v2-filter-basis">기준일 내 검색</span></label>
      <input type="text" id="fName" placeholder="대리점명" />
      <button type="button" class="admin-btn admin-btn--primary admin-btn--sm" id="searchBtn">검색</button>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="resetBtn">초기화</button>
    </div>

    <div class="settlement-section-title" id="tableSectionTitle">대리점별 정산 (기준일 단위)</div>
    <div class="settlement-actions-line">
      <div class="settlement-actions-line__left">
      </div>
      <div class="settlement-actions-line__right">
        <select class="admin-filter-select" id="pageSize"><option>5</option><option selected>10</option><option>20</option></select>
        <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="downloadBtn">엑셀 다운로드</button>
      </div>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table settlement-table" style="min-width:1240px;">
        <thead id="tableHead"></thead>
        <tbody id="settlementTableBody"></tbody>
      </table>
    </div>
    <div class="admin-empty-state" id="emptyState" style="display:none;">조회된 정산 데이터가 없습니다.</div>
    <div class="admin-pagination" id="paginationWrap"></div>
  </main>
</div>
<script src="../shared.js"></script>
<script src="settlement-v2.js"></script>
</body>
</html>
