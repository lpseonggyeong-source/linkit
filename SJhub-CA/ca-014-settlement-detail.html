<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정산 상세 내역 — SJ Hub CA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-settlement-mode="detail">
<header class="admin-mobile-header"><span class="admin-mobile-header__logo">SJ Hub</span><button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button></header>
<div class="admin-overlay" id="adminOverlay"></div>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar" data-role="ca"></aside>
  <main class="admin-main settlement-page settlement-page--wide">
    <div class="settlement-title-row">
      <h1 class="admin-page-title" id="detailName">지사_01</h1>
      <span class="settlement-fee" id="detailFee">수수료율 7%</span>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="editInfoBtn">정보 수정</button>
      <a href="ca-013-settlement.html" class="admin-btn admin-btn--outline admin-btn--sm" style="margin-left:auto;">목록으로</a>
    </div>

    <div class="settlement-section-title">오늘의 정산 정보</div>
    <div class="settlement-kpi-grid" id="settlementKpiGrid"></div>

    <div class="settlement-filter-line">
      <label>정산 기간</label>
      <input type="date" id="fFrom" value="2026-07-07" />
      <span>~</span>
      <input type="date" id="fTo" value="2026-07-07" />
      <select id="fTimeUnit"><option value="">전체</option><option>일별</option><option>주별</option><option>월별</option></select>
      <select id="fStatus"><option value="">정산상태 전체</option><option>정산 필요</option><option>정산대기</option><option>정산중</option><option>정산 완료</option><option>정산 보류</option></select>
      <button type="button" class="admin-btn admin-btn--primary admin-btn--sm" id="searchBtn">검색</button>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="resetBtn">초기화</button>
    </div>

    <div class="settlement-section-title" id="detailTableTitle">판매 내역</div>
    <div class="settlement-actions-line">
      <div class="settlement-actions-line__left">
        <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="selectAllBtn">전체 선택</button>
        <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="bulkStatusBtn">선택항목 상태 변경</button>
      </div>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="downloadBtn">엑셀 다운로드</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table settlement-table" style="min-width:1160px;">
        <thead><tr><th><input type="checkbox" aria-label="전체 선택" /></th><th>판매처</th><th class="text-left">판매 상품</th><th>주문번호</th><th>판매 일자</th><th class="text-right">판매금액</th><th>수수료</th><th class="text-right">정산 금액</th><th>정산 상태</th><th>상세보기</th></tr></thead>
        <tbody id="salesTableBody"></tbody>
      </table>
    </div>
    <div class="admin-empty-state" id="emptyState" style="display:none;">조회된 판매 내역이 없습니다.</div>
  </main>
</div>
<script src="shared.js"></script>
<script src="settlement-pages.js"></script>
</body>
</html>
