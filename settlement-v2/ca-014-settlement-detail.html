<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정산 상세 (개선판) — SJ Hub CA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../shared.css" />
<link rel="stylesheet" href="settlement-v2.css" />
</head>
<body data-v2-mode="detail">
<header class="admin-mobile-header"><span class="admin-mobile-header__logo">SJ Hub</span><button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button></header>
<div class="admin-overlay" id="adminOverlay"></div>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar" data-role="ca"></aside>
  <main class="admin-main settlement-page settlement-page--wide">
    <div class="settlement-title-row">
      <h1 class="admin-page-title" id="detailName">—</h1>
      <span class="v2-badge">개선판 v2</span>
      <a href="ca-013-settlement.html" id="backLink" class="admin-btn admin-btn--outline admin-btn--sm" style="margin-left:auto;">목록으로</a>
    </div>

    <div id="cyclePanel"></div>
    <div class="v2-owner-card" id="ownerCard"></div>

    <div class="settlement-section-title">정산 요약</div>
    <div class="v2-kpi-note">현재 필터된 거래 기준 · 수수료 = 판매금액 × 수수료율 · 지불해야 할 정산 금액 = 판매금액 − 수수료</div>
    <div class="settlement-kpi-grid" id="settlementKpiGrid"></div>

    <div class="settlement-filter-line">
      <label>정산 상태<span class="v2-filter-basis">상태별 필터</span></label>
      <select id="fStatus"><option value="">정산상태 전체</option><option>정산 필요</option><option>정산중</option><option>정산 완료</option></select>
      <button type="button" class="admin-btn admin-btn--primary admin-btn--sm" id="searchBtn">검색</button>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="resetBtn">초기화</button>
    </div>

    <div class="settlement-section-title">판매 내역 (거래 단위 상태 관리)</div>
    <div class="settlement-actions-line">
      <div class="settlement-actions-line__left">
        <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="selectAllBtn">전체 선택</button>
        <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="bulkStatusBtn">선택항목 상태 변경</button>
      </div>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="downloadBtn">엑셀 다운로드</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table settlement-table" style="min-width:1280px;">
        <thead><tr><th><input type="checkbox" aria-label="전체 선택" /></th><th>판매처</th><th class="text-left">판매 상품</th><th>주문번호</th><th>판매 일시</th><th class="text-right">판매금액</th><th>수수료율</th><th class="text-right">수수료</th><th class="text-right">지불해야 할 정산 금액</th><th>정산 상태</th><th>상세보기</th></tr></thead>
        <tbody id="salesTableBody"></tbody>
      </table>
    </div>
    <div class="admin-empty-state" id="emptyState" style="display:none;">조회된 거래 내역이 없습니다.</div>
  </main>
</div>
<script src="../shared.js"></script>
<script src="settlement-v2.js"></script>
</body>
</html>
