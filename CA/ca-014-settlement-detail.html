<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정산 상세 — link it CA 어드민</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
<style>
/* 탭 */
.pg-tabs { display:flex; border-bottom:2px solid var(--admin-stroke,#e5e7eb); margin-bottom:0; overflow-x:auto; }
.pg-tab { padding:10px 16px; font-size:13px; font-weight:500; color:var(--admin-muted,#9ca3af); cursor:pointer; border:none; border-bottom:2px solid transparent; margin-bottom:-2px; background:none; font-family:inherit; transition:color .15s,border-color .15s; white-space:nowrap; flex-shrink:0; }
.pg-tab.is-active { color:var(--admin-heading,#111); border-bottom-color:var(--admin-heading,#111); font-weight:600; }
.pg-tab:hover:not(.is-active) { color:var(--admin-heading,#111); }
/* 정산기본정보 행 */
.si-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 32px; }
@media(max-width:700px){ .si-grid { grid-template-columns:1fr; } }
.si-row { display:flex; align-items:center; padding:8px 0; border-bottom:1px solid var(--admin-stroke,#e5e7eb); gap:16px; }
.si-row:last-child { border-bottom:none; }
.si-lbl { font-size:12px; color:var(--admin-muted,#9ca3af); width:90px; flex-shrink:0; }
.si-val { font-size:14px; font-weight:500; color:var(--admin-heading,#111); }
/* 요약 카드 그리드 */
.sn-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
@media(max-width:900px){ .sn-grid { grid-template-columns:repeat(2,1fr); } }
@media(max-width:480px){ .sn-grid { grid-template-columns:1fr; } }
.sn-card { background:var(--admin-white,#fff); border:1px solid var(--admin-stroke,#e5e7eb); border-radius:8px; padding:16px; }
.sn-card__label { font-size:12px; color:var(--admin-muted,#9ca3af); margin-bottom:6px; }
.sn-card__value { font-size:20px; font-weight:700; color:var(--admin-heading,#111); }
.sn-card__value--red { color:var(--admin-red,#e83828); }
.sn-card__value--green { color:#2e7d32; }
/* 정산 목록 행 선택 */
.sett-list-row { cursor:pointer; }
.sett-list-row:hover td { background:var(--admin-row-hover,#f8f9fa) !important; }
.sett-list-row.is-selected td { background:#fef3f2 !important; }
/* 상태 변경 라디오 */
.status-option { display:flex; align-items:center; gap:8px; padding:12px 20px; border:2px solid var(--admin-stroke,#e5e7eb); border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; transition:border-color .15s; }
.status-option:has(input:checked) { border-color:var(--admin-red,#e83828); background:#fff5f5; }
/* 모달 */
.sm-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; align-items:center; justify-content:center; }
.sm-overlay.is-open { display:flex; }
.sm-modal { background:var(--admin-white,#fff); border-radius:10px; width:480px; max-width:calc(100vw - 32px); max-height:calc(100vh - 64px); overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,.18); }
.sm-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--admin-stroke,#e5e7eb); }
.sm-head h3 { font-size:15px; font-weight:700; color:var(--admin-heading,#111); margin:0; }
.sm-close { background:none; border:none; font-size:22px; color:var(--admin-muted,#9ca3af); cursor:pointer; line-height:1; padding:0; }
.sm-body { padding:20px; }
.sm-foot { display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--admin-stroke,#e5e7eb); }
/* util */
.tr { text-align:right; }
.tc { text-align:center; }
</style>
</head>
<body>
<header class="admin-mobile-header">
  <span class="admin-mobile-header__logo">link it</span>
  <button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
</header>
<div class="admin-overlay" id="adminOverlay"></div>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar" data-role="ca"></aside>
  <main class="admin-main">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;">
      <a href="ca-013-settlement.html" class="admin-btn admin-btn--outline admin-btn--sm">← 정산 요약</a>
      <h1 class="admin-page-title" style="margin-bottom:0;">정산 상세</h1>
    </div>

    <!-- 선택된 정산 기본 정보 -->
    <div class="admin-card" style="margin-bottom:16px;" id="settInfoCard">
      <div class="admin-card__header" style="flex-wrap:wrap;gap:8px;">
        <span class="admin-card__title">정산 기본 정보</span>

        <button class="admin-btn admin-btn--outline admin-btn--sm" id="statusEditBtn" style="display:none;">상태 수정</button>

      </div>
      <div class="admin-card__body" id="settInfoBody">
        <p style="text-align:center;color:var(--admin-muted);padding:20px 0;font-size:14px;">정산 내역 목록에서 항목을 선택하세요</p>
      </div>
    </div>

    <!-- 금액 요약 카드 -->
    <div class="sn-grid" style="margin-bottom:16px;" id="settAmtGrid">
      <div class="sn-card"><div class="sn-card__label">총 주문금액</div><div class="sn-card__value" id="snTotal">—</div></div>
      <div class="sn-card"><div class="sn-card__label">취소/반품 차감</div><div class="sn-card__value sn-card__value--red" id="snDeduct">—</div></div>
      <div class="sn-card"><div class="sn-card__label">수수료</div><div class="sn-card__value sn-card__value--red" id="snFee">—</div></div>
      <div class="sn-card" id="snFinalCard"><div class="sn-card__label">최종 정산액</div><div class="sn-card__value sn-card__value--green" id="snFinal">—</div></div>
    </div>

    <!-- 탭 -->
    <div class="admin-card">
      <div style="padding:0 20px;">
        <div class="pg-tabs" id="detailTabs">
          <button class="pg-tab is-active" data-tab="list">정산내역 목록</button>
          <button class="pg-tab" data-tab="brand">브랜드 정산 내역</button>
          <button class="pg-tab" data-tab="seller">셀러 정산 내역</button>
        </div>
      </div>

      <div id="tab-list" class="admin-card__body--flush">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>정산번호</th><th>정산기간</th><th>브랜드</th><th>셀러</th>
                <th>결제코드</th><th class="tr">총주문금액</th><th class="tr">반품 차감</th>
                <th class="tr">PG수수료</th><th class="tr">최종정산액</th>
                <th>정산상태</th>
              </tr>
            </thead>
            <tbody id="settlementListBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 탭: 브랜드 정산 목록 -->
      <div id="tab-brand" class="admin-card__body--flush" style="display:none;">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>정산번호</th><th>정산기간</th><th>브랜드명</th><th class="tc">주문수</th><th class="tr">총매출</th><th class="tr">취소차감</th><th class="tr">수수료</th><th class="tr">정산금액</th><th>정산상태</th></tr></thead>
            <tbody id="brandDetailBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 탭: 셀러 정산 목록 -->
      <div id="tab-seller" class="admin-card__body--flush" style="display:none;">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>정산번호</th><th>정산기간</th><th>셀러명</th><th>소속유형</th><th class="tc">주문수</th><th class="tr">총매출</th><th class="tr">취소차감</th><th class="tr">수수료</th><th class="tr">정산금액</th><th>정산상태</th></tr></thead>
            <tbody id="sellerDetailBody"></tbody>
          </table>
        </div>
      </div>

    </div><!-- /admin-card -->

  </main>
</div>
<!-- 정산 상태 변경 모달 -->
<div class="sm-overlay" id="statusModal">
  <div class="sm-modal">
    <div class="sm-head">
      <h3>정산 상태 변경</h3>
      <button class="sm-close" id="statusModalClose">×</button>
    </div>
    <div class="sm-body">
      <p style="font-size:13px;color:var(--admin-muted);margin-bottom:20px;" id="modalCurStatus"></p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
        <label class="status-option">
          <input type="radio" name="newStatus" value="미정산" style="accent-color:var(--admin-red,#e83828);" />
          <span>미정산</span><span style="font-size:11px;color:var(--admin-muted);margin-left:4px;">(정산 신청 전)</span>
        </label>
        <label class="status-option">
          <input type="radio" name="newStatus" value="정산중" style="accent-color:var(--admin-red,#e83828);" />
          <span>정산중</span><span style="font-size:11px;color:var(--admin-muted);margin-left:4px;">(신청완료/입금 전)</span>
        </label>
        <label class="status-option">
          <input type="radio" name="newStatus" value="정산완료" style="accent-color:var(--admin-red,#e83828);" />
          <span>정산완료</span><span style="font-size:11px;color:var(--admin-muted);margin-left:4px;">(입금 완료)</span>
        </label>
      </div>
      <div>
        <label style="font-size:13px;color:var(--admin-muted);display:block;margin-bottom:6px;">메모 (선택)</label>
        <textarea id="statusMemo" style="width:100%;padding:10px 12px;border:1px solid var(--admin-stroke,#e5e7eb);border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;min-height:80px;box-sizing:border-box;" placeholder="상태 변경 사유를 입력하세요"></textarea>
      </div>
    </div>
    <div class="sm-foot">
      <button class="admin-btn admin-btn--outline" id="statusModalCancel">취소</button>
      <button class="admin-btn admin-btn--primary" id="statusModalSave">저장</button>
    </div>
  </div>
</div>

    { no:"SETT-2026-006", period:"2026.02.01~02.28", brand:"루미데이", code:"PAY-AURORA-002", total:5800000,  deduct:-130000, fee:-283500, final:5386500,  status:"정산완료", date:"2026.03.18", bank:"국민은행 123-456-789012", holder:"㈜오로라" },
    { no:"SETT-2026-007", period:"2026.01.01~01.31", brand:"어반무드", code:"PAY-AURORA-001", total:8200000,  deduct:-250000, fee:-397500, final:7552500,  status:"정산완료", date:"2026.02.15", bank:"국민은행 123-456-789012", holder:"㈜오로라" },
    { no:"SETT-2026-008", period:"2026.01.01~01.31", brand:"루미데이", code:"PAY-AURORA-002", total:4800000,  deduct:-100000, fee:-235000, final:4465000,  status:"정산완료", date:"2026.02.18", bank:"국민은행 123-456-789012", holder:"㈜오로라" },
  ];

  var BRAND_DETAIL = {
    "SETT-2026-001": [{ name:"어반무드", orders:312, sales:12500000, cancel:-500000, fee:-600000, final:11400000 }],
    "SETT-2026-002": [{ name:"루미데이", orders:198, sales:7200000,  cancel:-180000, fee:-351000, final:6669000  }],
    "SETT-2026-003": [{ name:"어반무드", orders:298, sales:11200000, cancel:-380000, fee:-541000, final:10279000 }],
    "SETT-2026-004": [{ name:"루미데이", orders:175, sales:6500000,  cancel:-160000, fee:-317000, final:6023000  }],
    "SETT-2026-005": [{ name:"어반무드", orders:252, sales:9600000,  cancel:-290000, fee:-465500, final:8844500  }],
    "SETT-2026-006": [{ name:"루미데이", orders:148, sales:5800000,  cancel:-130000, fee:-283500, final:5386500  }],
    "SETT-2026-007": [{ name:"어반무드", orders:210, sales:8200000,  cancel:-250000, fee:-397500, final:7552500  }],
    "SETT-2026-008": [{ name:"루미데이", orders:120, sales:4800000,  cancel:-100000, fee:-235000, final:4465000  }],
  };

  var SELLER_DETAIL = {
    "SETT-2026-001": [
      { name:"셀러A", type:"업체 소속",  orders:70, sales:2700000, fee:-129500, final:2460500 },
      { name:"셀러C", type:"브랜드 직접",orders:35, sales:1400000, fee:-67000,  final:1273000 },
      { name:"셀러G", type:"브랜드 소속",orders:27, sales: 600000, fee:-28500,  final: 571500 },
    ],
    "SETT-2026-002": [
      { name:"셀러A", type:"업체 소속",  orders:62, sales:2400000, fee:-115500, final:2184500 },
      { name:"셀러H", type:"브랜드 소속",orders:46, sales:1600000, fee:-77000,  final:1523000 },
    ],
    "SETT-2026-003": [
      { name:"셀러A", type:"업체 소속",  orders:65, sales:2500000, fee:-120500, final:2379500 },
      { name:"셀러C", type:"브랜드 직접",orders:30, sales:1200000, fee:-57000,  final:1143000 },
      { name:"셀러G", type:"브랜드 소속",orders:20, sales: 500000, fee:-23500,  final: 476500 },
    ],
    "SETT-2026-004": [
      { name:"셀러A", type:"업체 소속",  orders:55, sales:2100000, fee:-101000, final:1999000 },

    ],
    "SETT-2026-006": [
      { name:"셀러A", type:"업체 소속",  orders:48, sales:1800000, fee:-86000,  final:1714000 },
      { name:"셀러H", type:"브랜드 소속",orders:25, sales:1400000, fee:-67000,  final:1333000 },

    "SETT-2026-007": [

  var selectedIdx = -1;
  var CA_TYPES = ["업체 소속", "업체 직접"];

  function getCASellerNames(settNo) {
    return (SELLER_DETAIL[settNo] || [])
      .filter(function(r) { return CA_TYPES.indexOf(r.type) >= 0; })
      .map(function(r) { return r.name; })
      .join(" · ") || "—";
  }

  /* 브랜드/셀러 전체 목록 (flat) */
  var BRAND_LIST = [];
  var SELLER_LIST = [];
  SETTLEMENTS.forEach(function(s, si) {
    (BRAND_DETAIL[s.no] || []).forEach(function(r) {
      BRAND_LIST.push({ no:s.no, period:s.period, settIdx:si, name:r.name, orders:r.orders, sales:r.sales, cancel:r.cancel, fee:r.fee, final:r.final });
    });
    (SELLER_DETAIL[s.no] || []).forEach(function(r) {
      SELLER_LIST.push({ no:s.no, period:s.period, settIdx:si, name:r.name, type:r.type, orders:r.orders, sales:r.sales, cancel:r.final - r.sales - r.fee, fee:r.fee, final:r.final });
    });
  });

  function renderList() {
    document.getElementById("settlementListBody").innerHTML = SETTLEMENTS.map(function(d, i) {

        '<td style="font-size:12px;">' + d.period + '</td>' +
        '<td style="font-weight:600;">' + d.brand + '</td>' +
        '<td style="font-size:12px;color:var(--admin-muted);">' + getCASellerNames(d.no) + '</td>' +
        '<td style="font-size:12px;color:var(--admin-muted);">' + d.code + '</td>' +
        '<td class="tr">' + fc(d.total) + '</td>' +
        '<td class="tr" style="color:var(--admin-red);">' + fc(d.deduct) + '</td>' +
        '<td class="tr" style="color:var(--admin-muted);">' + fc(d.fee) + '</td>' +
        '<td class="tr" style="font-weight:600;">' + fc(d.final) + '</td>' +
        '<td class="tc">' + AdminShared.settlementBadge(d.status) + '</td>' +
      '</tr>';
    }).join("");
  }

  function renderBrandList() {
    document.getElementById("brandDetailBody").innerHTML = BRAND_LIST.map(function(r, i) {
      return '<tr class="sett-list-row" data-listidx="' + i + '">' +
        '<td style="font-size:12px;color:var(--admin-muted);">' + r.no + '</td>' +
        '<td style="font-size:12px;">' + r.period + '</td>' +
        '<td style="font-weight:600;">' + r.name + '</td>' +
        '<td class="tc">' + r.orders.toLocaleString() + '건</td>' +
        '<td class="tr">' + fc(r.sales) + '</td>' +
        '<td class="tr" style="color:var(--admin-red);">' + fc(r.cancel) + '</td>' +
        '<td class="tr" style="color:var(--admin-muted);">' + fc(r.fee) + '</td>' +
        '<td class="tr" style="font-weight:600;">' + fc(r.final) + '</td>' +
        '<td class="tc">' + AdminShared.settlementBadge(SETTLEMENTS[r.settIdx].status) + '</td>' +
      '</tr>';
    }).join("");
  }

  function renderSellerList() {
    document.getElementById("sellerDetailBody").innerHTML = SELLER_LIST.map(function(r, i) {
      var isCA = CA_TYPES.indexOf(r.type) >= 0;
      return '<tr class="sett-list-row" data-listidx="' + i + '">' +
        '<td style="font-size:12px;color:var(--admin-muted);">' + r.no + '</td>' +
        '<td style="font-size:12px;">' + r.period + '</td>' +
        '<td style="font-weight:600;">' + r.name + '</td>' +
        '<td class="tc">' + AdminShared.sellerTypeBadge(r.type) + '</td>' +
        '<td class="tc">' + r.orders.toLocaleString() + '건</td>' +
        '<td class="tr">' + fc(r.sales) + '</td>' +
        '<td class="tr" style="color:var(--admin-red);">' + fc(r.cancel) + '</td>' +
        '<td class="tr" style="color:var(--admin-muted);">' + fc(r.fee) + '</td>' +
        '<td class="tr" style="font-weight:600;">' + fc(r.final) + '</td>' +
        '<td class="tc">' + (isCA ? AdminShared.settlementBadge(SETTLEMENTS[r.settIdx].status) : '<span style="color:var(--admin-muted);">—</span>') + '</td>' +
      '</tr>';
    }).join("");
  }

  function updateInfoPanel(d) {
    document.getElementById("settInfoBadge").innerHTML = AdminShared.settlementBadge(d.status);
    document.getElementById("statusEditBtn").style.display = "";
    document.getElementById("settInfoHint").style.display = "none";
    document.getElementById("settInfoBody").innerHTML =
      '<div class="si-grid">' +
        '<div>' +
          '<div class="si-row"><span class="si-lbl">정산번호</span><span class="si-val" style="font-family:monospace;font-size:13px;">' + d.no + '</span></div>' +
          '<div class="si-row"><span class="si-lbl">정산기간</span><span class="si-val">' + d.period.replace("~"," ~ ") + '</span></div>' +
          '<div class="si-row"><span class="si-lbl">브랜드</span><span class="si-val">' + d.brand + '</span></div>' +
          '<div class="si-row"><span class="si-lbl">결제코드</span><span class="si-val" style="font-family:monospace;font-size:13px;">' + d.code + '</span></div>' +
        '</div>' +
        '<div>' +
          '<div class="si-row"><span class="si-lbl">정산일</span><span class="si-val">' + d.date + '</span></div>' +
          '<div class="si-row"><span class="si-lbl">지급계좌</span><span class="si-val">' + d.bank + '</span></div>' +
          '<div class="si-row"><span class="si-lbl">예금주</span><span class="si-val">' + d.holder + '</span></div>' +
        '</div>' +
      '</div>';
    document.getElementById("snTotal").textContent  = fc(d.total);
    document.getElementById("snDeduct").textContent = fc(d.deduct);
    document.getElementById("snFee").textContent    = fc(d.fee);
    document.getElementById("snFinal").textContent  = fc(d.final);
  }

  function openStatusModal() {
    var d = SETTLEMENTS[selectedIdx];
    document.getElementById("modalCurStatus").textContent = "현재 상태: " + d.status;
    document.querySelectorAll("input[name=newStatus]").forEach(function(r) { r.checked = r.value === d.status; });
    document.getElementById("statusMemo").value = "";
    document.getElementById("statusModal").classList.add("is-open");
  }

  function closeStatusModal() {
    document.getElementById("statusModal").classList.remove("is-open");
  }

  document.addEventListener("DOMContentLoaded", function() {
    renderList();
    renderBrandList();
    renderSellerList();

    /* 탭 전환 */
    document.getElementById("detailTabs").addEventListener("click", function(e) {
      var btn = e.target.closest(".pg-tab");
      if (!btn) return;
      document.querySelectorAll(".pg-tab").forEach(function(t){ t.classList.remove("is-active"); });
      btn.classList.add("is-active");
      ["list","brand","seller"].forEach(function(id) {
        document.getElementById("tab-" + id).style.display = btn.dataset.tab === id ? "" : "none";
      });
    });

    /* 목록 행 클릭 → 기본 정보 패널 업데이트 */
    document.getElementById("settlementListBody").addEventListener("click", function(e) {
      var row = e.target.closest(".sett-list-row");
      if (!row || e.target.closest("a")) return;
      selectedIdx = +row.dataset.idx;
      renderList();
      updateInfoPanel(SETTLEMENTS[selectedIdx]);
    });

    /* 브랜드 행 클릭 → 기본 정보 패널 업데이트 */
    document.getElementById("brandDetailBody").addEventListener("click", function(e) {
      var row = e.target.closest(".sett-list-row");
      if (!row) return;
      var r = BRAND_LIST[+row.dataset.listidx];
      if (!r) return;
      selectedIdx = r.settIdx;
      updateInfoPanel(SETTLEMENTS[selectedIdx]);
    });

    /* 셀러 행 클릭 → 기본 정보 패널 업데이트 */
    document.getElementById("sellerDetailBody").addEventListener("click", function(e) {
      var row = e.target.closest(".sett-list-row");
      if (!row) return;
      var r = SELLER_LIST[+row.dataset.listidx];
      if (!r) return;
      selectedIdx = r.settIdx;
      updateInfoPanel(SETTLEMENTS[selectedIdx]);
      var isCA = CA_TYPES.indexOf(r.type) >= 0;
      document.getElementById("statusEditBtn").style.display = isCA ? "" : "none";
    });

    /* 상태 수정 버튼 */
    document.getElementById("statusEditBtn").addEventListener("click", openStatusModal);

    /* 모달 닫기 */
    document.getElementById("statusModalClose").addEventListener("click", closeStatusModal);
    document.getElementById("statusModalCancel").addEventListener("click", closeStatusModal);
    document.getElementById("statusModal").addEventListener("click", function(e) { if (e.target === this) closeStatusModal(); });

    /* 상태 저장 */
    document.getElementById("statusModalSave").addEventListener("click", function() {
      var checked = document.querySelector("input[name=newStatus]:checked");
      if (!checked) { alert("변경할 상태를 선택해주세요."); return; }
      SETTLEMENTS[selectedIdx].status = checked.value;
      renderList();
      renderBrandList();
      renderSellerList();
      updateInfoPanel(SETTLEMENTS[selectedIdx]);
      closeStatusModal();
      alert("정산 상태가 [" + checked.value + "]로 변경되었습니다.");
    });
  });
})();
</script>
</body>
</html>
