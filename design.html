<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디자인 관리 — link it 어드민</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<header class="admin-mobile-header">
  <span class="admin-mobile-header__logo">link it</span>
  <button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="admin-overlay" id="adminOverlay"></div>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">

    <!-- ══════════════════════════════════════════════
         템플릿 선택 화면
         ══════════════════════════════════════════════ -->
    <div id="designTemplateScreen">
      <h1 class="admin-page-title">디자인 관리</h1>
      <h2 class="admin-design-template-heading">디자인 템플릿 선택</h2>

      <div class="admin-design-template-grid">

        <!-- 템플릿 카드 1 -->
        <div class="admin-design-tpl-card" data-template="미니멀">
          <div class="admin-design-tpl-card__thumb">
            <img src="assets/design-img/minimal.png" alt="미니멀 템플릿 미리보기" />
          </div>
          <div class="admin-design-tpl-card__body">
            <p class="admin-design-tpl-card__name">심플 미니멀/베이직</p>
            <p class="admin-design-tpl-card__desc">깔끔하고 단순한 구성의 기본 템플릿</p>
            <div class="admin-design-tpl-card__actions">
              <button type="button" class="admin-design-tpl-btn admin-design-tpl-btn--outline" data-action="preview">미리보기</button>
              <a href="design-editor.html" class="admin-design-tpl-btn admin-design-tpl-btn--solid">선택</a>
            </div>
          </div>
        </div>

        <!-- 템플릿 카드 2 -->
        <div class="admin-design-tpl-card" data-template="모던">
          <div class="admin-design-tpl-card__thumb">
            <img src="assets/design-img/modern.png" alt="모던 템플릿 미리보기" />
          </div>
          <div class="admin-design-tpl-card__body">
            <p class="admin-design-tpl-card__name">정돈된 레이아웃의 모던 스타일</p>
            <p class="admin-design-tpl-card__desc">세련된 레이아웃의 현대적인 템플릿</p>
            <div class="admin-design-tpl-card__actions">
              <button type="button" class="admin-design-tpl-btn admin-design-tpl-btn--outline" data-action="preview">미리보기</button>
              <a href="design-editor.html" class="admin-design-tpl-btn admin-design-tpl-btn--solid">선택</a>
            </div>
          </div>
        </div>

        <!-- 템플릿 카드 3 -->
        <div class="admin-design-tpl-card" data-template="러블리">
          <div class="admin-design-tpl-card__thumb">
            <img src="assets/design-img/lovely.png" alt="러블리 템플릿 미리보기" />
          </div>
          <div class="admin-design-tpl-card__body">
            <p class="admin-design-tpl-card__name">러블리 무드</p>
            <p class="admin-design-tpl-card__desc">부드럽고 감성적인 분위기의 템플릿</p>
            <div class="admin-design-tpl-card__actions">
              <button type="button" class="admin-design-tpl-btn admin-design-tpl-btn--outline" data-action="preview">미리보기</button>
              <a href="design-editor.html" class="admin-design-tpl-btn admin-design-tpl-btn--solid">선택</a>
            </div>
          </div>
        </div>

        <!-- 템플릿 카드 4 -->
        <div class="admin-design-tpl-card" data-template="링크리스트">
          <div class="admin-design-tpl-card__thumb">
            <img src="assets/design-img/linklist.png" alt="링크리스트 템플릿 미리보기" />
          </div>
          <div class="admin-design-tpl-card__body">
            <p class="admin-design-tpl-card__name">링크리스트</p>
            <p class="admin-design-tpl-card__desc">링크 목록 중심의 간결한 구조 템플릿</p>
            <div class="admin-design-tpl-card__actions">
              <button type="button" class="admin-design-tpl-btn admin-design-tpl-btn--outline" data-action="preview">미리보기</button>
              <a href="design-editor.html" class="admin-design-tpl-btn admin-design-tpl-btn--solid">선택</a>
            </div>
          </div>
        </div>

        <!-- 템플릿 카드 5 -->
        <div class="admin-design-tpl-card" data-template="오가닉">
          <div class="admin-design-tpl-card__thumb">
            <img src="assets/design-img/organic.png" alt="오가닉 템플릿 미리보기" />
          </div>
          <div class="admin-design-tpl-card__body">
            <p class="admin-design-tpl-card__name">오가닉</p>
            <p class="admin-design-tpl-card__desc">자연스럽고 따뜻한 느낌의 템플릿</p>
            <div class="admin-design-tpl-card__actions">
              <button type="button" class="admin-design-tpl-btn admin-design-tpl-btn--outline" data-action="preview">미리보기</button>
              <a href="design-editor.html" class="admin-design-tpl-btn admin-design-tpl-btn--solid">선택</a>
            </div>
          </div>
        </div>

        <!-- 템플릿 카드 6 -->
        <div class="admin-design-tpl-card" data-template="러블리">
          <div class="admin-design-tpl-card__thumb">
            <img src="assets/design-img/lovely.png" alt="러블리 다크 템플릿 미리보기" />
          </div>
          <div class="admin-design-tpl-card__body">
            <p class="admin-design-tpl-card__name">러블리 다크</p>
            <p class="admin-design-tpl-card__desc">러블리 템플릿의 다크 컬러 변형 버전</p>
            <div class="admin-design-tpl-card__actions">
              <button type="button" class="admin-design-tpl-btn admin-design-tpl-btn--outline" data-action="preview">미리보기</button>
              <a href="design-editor.html" class="admin-design-tpl-btn admin-design-tpl-btn--solid">선택</a>
            </div>
          </div>
        </div>

      </div><!-- /template-grid -->
    </div><!-- /templateScreen -->


  </main>
</div>

<!-- ══ 디자인 미리보기 모달 ══ -->
<div class="admin-design-preview-modal" id="designPreviewModal" role="dialog" aria-modal="true" style="display:none;">
  <div class="admin-design-preview-modal__overlay" id="designPreviewModalOverlay"></div>
  <div class="admin-design-preview-modal__box">
    <div class="admin-design-preview-modal__header">
      <span>디자인 미리보기</span>
      <button type="button" class="admin-design-preview-modal__close" id="designPreviewModalClose" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="admin-design-preview-modal__body" id="designPreviewModalBody"></div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
