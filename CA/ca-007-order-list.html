<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전체 주문 내역 — link it CA 어드민</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
</head>
<body>
<header class="admin-mobile-header">
  <span class="admin-mobile-header__logo">link it</span>
  <button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
</header>
<div class="admin-overlay" id="adminOverlay"></div>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar" data-role="ca"></aside>
  <main class="admin-main">

    <h1 class="admin-page-title">전체 주문 내역</h1>

    <div class="ca-brand-bar">
      <span class="ca-brand-bar__label">브랜드 선택</span>
      <div class="ca-brand-bar__select-wrap">
        <select class="ca-brand-bar__select">
          <option value="">전체 브랜드</option>
          <option>어반무드</option><option>바이엘르</option>
          <option>루미데이</option><option>모노픽</option><option>소프트블랭크</option>
        </select>
        <svg class="ca-brand-bar__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <!-- 주문 상태 요약 -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;" id="statusSummary"></div>

    <!-- 필터 -->
    <div class="admin-filter-card">
      <div class="admin-filter-row" style="margin-bottom:10px;">
        <span class="admin-filter-label">브랜드</span>
        <select class="admin-filter-select" id="fBrand">
          <option value="">전체</option>
          <option>어반무드</option><option>바이엘르</option><option>루미데이</option><option>모노픽</option><option>소프트블랭크</option>
        </select>
        <span class="admin-filter-label">셀러</span>
        <select class="admin-filter-select" id="fSeller">
          <option value="">전체</option>
          <option>셀러A</option><option>셀러B</option><option>셀러C</option><option>셀러D</option><option>셀러E</option><option>셀러F</option>
        </select>
        <span class="admin-filter-label">주문상태</span>
        <select class="admin-filter-select" id="fStatus">
          <option value="">전체</option>
          <option>상품 준비중</option><option>취소 준비중</option><option>취소완료</option><option>배송준비중</option><option>배송중</option>
        </select>
        <span class="admin-filter-label">주문기간</span>
        <div class="admin-filter-date-range">
          <input type="date" class="admin-filter-input" id="fDateFrom" style="min-width:130px;" />
          <span>~</span>
          <input type="date" class="admin-filter-input" id="fDateTo" style="min-width:130px;" />
        </div>
      </div>
      <div class="admin-filter-row">
        <span class="admin-filter-label">상품명</span>
        <input type="text" class="admin-filter-input" id="fProduct" placeholder="상품명 검색" />
        <span class="admin-filter-label">주문번호</span>
        <input type="text" class="admin-filter-input" id="fOrderNo" placeholder="주문번호 검색" />
        <button class="admin-btn admin-btn--primary" id="searchBtn">검색</button>
        <button class="admin-btn admin-btn--outline" id="resetBtn">초기화</button>
      </div>
    </div>

    <!-- 액션바 -->
    <div class="admin-action-bar">
      <div class="admin-action-bar__left">
        <button class="admin-btn admin-btn--outline admin-btn--sm" id="batchStatusBtn">선택 주문상태 변경</button>
      </div>
      <div class="admin-action-bar__right">
        <button class="admin-btn admin-btn--outline admin-btn--sm">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          배송자료 다운로드
        </button>
        <button class="admin-btn admin-btn--outline admin-btn--sm">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          송장번호 업로드
        </button>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="admin-card">
      <div class="admin-card__body--flush">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th style="width:40px;"><input type="checkbox" id="selectAll" /></th>
                <th>주문번호</th><th>주문일</th><th>브랜드</th><th>셀러</th>
                <th class="text-left">상품명</th><th>수량</th>
                <th class="text-right">주문금액</th><th>주문상태</th>
                <th>배송지수정</th><th>관리</th>
              </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
          </table>
        </div>
        <div class="admin-empty-state" id="emptyState" style="display:none;">조회된 주문이 없습니다.</div>
      </div>
      <div class="admin-pagination" id="paginationWrap"></div>
    </div>

    <!-- 배송지 수정 모달 -->
    <div class="admin-modal" id="addrModal">
      <div class="admin-modal__overlay" id="addrOverlay"></div>
      <div class="admin-modal__box">
        <div class="admin-modal__header">
          <span class="admin-modal__title">배송지 수정</span>
          <button class="admin-modal__close admin-btn" id="addrClose">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="admin-field"><label>수령인</label><input type="text" id="addrName" /></div>
        <div class="admin-field"><label>연락처</label><input type="tel" id="addrPhone" /></div>
        <div class="admin-field"><label>주소</label><input type="text" id="addrAddr" /></div>
        <div class="admin-field"><label>상세주소</label><input type="text" id="addrAddr2" /></div>
        <div class="admin-modal__footer">
          <button class="admin-btn admin-btn--outline" id="addrCancelBtn">취소</button>
          <button class="admin-btn admin-btn--primary" id="addrSaveBtn">저장</button>
        </div>
      </div>
    </div>

  </main>
</div>
<script src="shared.js"></script>
<script>
(function() {
  "use strict";
  var fc = AdminShared.formatCurrency;

  var ORDERS = [
    { no:"ORD-20260520-001", date:"2026.05.20", brand:"어반무드",    seller:"셀러A", name:"리넨 와이드 팬츠",  qty:1, amt:45000,  status:"배송중",    addr:{name:"김민준",phone:"010-1234-5678",addr:"서울시 강남구 역삼동 123",addr2:"101호"} },
    { no:"ORD-20260520-002", date:"2026.05.20", brand:"바이엘르",   seller:"셀러D", name:"바디로션 세트",     qty:2, amt:136000, status:"상품 준비중",addr:{name:"이서연",phone:"010-2345-6789",addr:"서울시 마포구 서교동 456",addr2:""} },
    { no:"ORD-20260519-015", date:"2026.05.19", brand:"루미데이",   seller:"셀러B", name:"퍼퓸 캔들",         qty:1, amt:42000,  status:"배송준비중", addr:{name:"박지호",phone:"010-3456-7890",addr:"경기도 성남시 분당구 정자동 789",addr2:""} },
    { no:"ORD-20260519-014", date:"2026.05.19", brand:"모노픽",     seller:"셀러F", name:"원목 선반 세트",    qty:1, amt:89000,  status:"배송중",    addr:{name:"최유진",phone:"010-4567-8901",addr:"부산시 해운대구 우동 321",addr2:"302호"} },
    { no:"ORD-20260519-013", date:"2026.05.19", brand:"소프트블랭크",seller:"셀러E", name:"캐시미어 담요",    qty:1, amt:128000, status:"취소완료",  addr:{name:"정하은",phone:"010-5678-9012",addr:"대구시 달서구 성당동 654",addr2:""} },
    { no:"ORD-20260518-012", date:"2026.05.18", brand:"어반무드",    seller:"셀러C", name:"크롭 린넨 자켓",   qty:1, amt:89000,  status:"배송중",    addr:{name:"강서준",phone:"010-6789-0123",addr:"인천시 부평구 부평동 987",addr2:""} },
    { no:"ORD-20260518-011", date:"2026.05.18", brand:"바이엘르",   seller:"셀러D", name:"립 세럼",           qty:3, amt:114000, status:"상품 준비중",addr:{name:"윤예은",phone:"010-7890-1234",addr:"광주시 서구 치평동 147",addr2:"201호"} },
    { no:"ORD-20260518-010", date:"2026.05.18", brand:"루미데이",   seller:"셀러A", name:"도자기 화분 세트", qty:1, amt:55000,  status:"상품 준비중",addr:{name:"임재원",phone:"010-8901-2345",addr:"대전시 유성구 궁동 258",addr2:""} },
    { no:"ORD-20260517-009", date:"2026.05.17", brand:"어반무드",    seller:"셀러A", name:"슬럽 코튼 드레스", qty:1, amt:67000,  status:"배송중",    addr:{name:"한소희",phone:"010-9012-3456",addr:"울산시 남구 삼산동 369",addr2:""} },
    { no:"ORD-20260517-008", date:"2026.05.17", brand:"모노픽",     seller:"셀러F", name:"대나무 수납 박스", qty:2, amt:98000,  status:"취소 준비중",addr:{name:"조민서",phone:"010-0123-4567",addr:"서울시 송파구 잠실동 741",addr2:""} },
    { no:"ORD-20260516-007", date:"2026.05.16", brand:"소프트블랭크",seller:"셀러E", name:"면 쿠션 커버",     qty:4, amt:72000,  status:"배송준비중", addr:{name:"신지우",phone:"010-1111-2222",addr:"경기도 수원시 팔달구 매산동 852",addr2:""} },
    { no:"ORD-20260516-006", date:"2026.05.16", brand:"바이엘르",   seller:"셀러B", name:"선크림 SPF50",     qty:2, amt:78000,  status:"배송중",    addr:{name:"홍민채",phone:"010-2222-3333",addr:"서울시 용산구 이태원동 963",addr2:""} },
    { no:"ORD-20260515-005", date:"2026.05.15", brand:"어반무드",    seller:"셀러C", name:"린넨 버킷백",      qty:1, amt:52000,  status:"배송중",    addr:{name:"류채원",phone:"010-3333-4444",addr:"서울시 은평구 응암동 174",addr2:""} },
    { no:"ORD-20260515-004", date:"2026.05.15", brand:"루미데이",   seller:"셀러B", name:"무선 디퓨저",      qty:1, amt:72000,  status:"취소완료",  addr:{name:"문서아",phone:"010-4444-5555",addr:"경기도 고양시 일산서구 주엽동 285",addr2:""} },
    { no:"ORD-20260514-003", date:"2026.05.14", brand:"모노픽",     seller:"셀러F", name:"원목 도마",        qty:1, amt:34000,  status:"배송준비중", addr:{name:"백준혁",phone:"010-5555-6666",addr:"서울시 강서구 화곡동 396",addr2:""} },
  ];

  var filtered = ORDERS.slice();
  var PAGE_SIZE = 15;
  var currentPage = 1;

  var statusSummaryData = [
    { label:"상품 준비중", count:45, status:"상품 준비중" },
    { label:"취소 준비중", count:12, status:"취소 준비중" },
    { label:"배송준비중",  count:89, status:"배송준비중" },
    { label:"배송중",      count:198,status:"배송중" },
  ];

  function renderStatusSummary() {
    var el = document.getElementById("statusSummary");
    el.innerHTML = statusSummaryData.map(function(d) {
      return '<div style="background:var(--admin-white);border:1px solid var(--admin-stroke);border-radius:6px;padding:8px 16px;display:flex;gap:6px;align-items:center;cursor:pointer;" onclick="filterByStatus(\'' + d.status + '\')">' +
        '<span style="font-size:12px;color:var(--admin-muted);">' + d.label + '</span>' +
        '<strong style="color:var(--admin-heading);">' + d.count + '건</strong>' +
      '</div>';
    }).join("");
  }

  window.filterByStatus = function(s) {
    document.getElementById("fStatus").value = s;
    applyFilter();
  };

  function applyFilter() {
    var b = document.getElementById("fBrand").value;
    var s = document.getElementById("fSeller").value;
    var st = document.getElementById("fStatus").value;
    var p = document.getElementById("fProduct").value.trim();
    var n = document.getElementById("fOrderNo").value.trim();
    filtered = ORDERS.filter(function(o) {
      if (b && o.brand !== b) return false;
      if (s && o.seller !== s) return false;
      if (st && o.status !== st) return false;
      if (p && o.name.indexOf(p) < 0) return false;
      if (n && o.no.indexOf(n) < 0) return false;
      return true;
    });
    currentPage = 1;
    render();
  }

  function render() {
    var tbody = document.getElementById("orderTableBody");
    var empty = document.getElementById("emptyState");
    if (!filtered.length) {
      tbody.innerHTML = "";
      empty.style.display = "";
      document.getElementById("paginationWrap").innerHTML = "";
      return;
    }
    empty.style.display = "none";
    var start = (currentPage - 1) * PAGE_SIZE;
    var rows = filtered.slice(start, start + PAGE_SIZE);
    tbody.innerHTML = rows.map(function(o, i) {
      return '<tr>' +
        '<td style="text-align:center;"><input type="checkbox" data-idx="' + (start+i) + '" /></td>' +
        '<td style="font-size:12px;">' + o.no + '</td>' +
        '<td style="font-size:12px;">' + o.date + '</td>' +
        '<td>' + o.brand + '</td>' +
        '<td>' + o.seller + '</td>' +
        '<td class="text-left">' + o.name + '</td>' +
        '<td style="text-align:center;">' + o.qty + '</td>' +
        '<td class="text-right">' + fc(o.amt) + '</td>' +
        '<td style="text-align:center;">' + AdminShared.orderBadge(o.status) + '</td>' +
        '<td style="text-align:center;"><button class="admin-btn admin-btn--outline admin-btn--sm" onclick="openAddr(' + (start+i) + ')">수정</button></td>' +
        '<td style="text-align:center;"><button class="admin-btn admin-btn--outline admin-btn--sm">상세</button></td>' +
      '</tr>';
    }).join("");
    AdminShared.renderPagination(
      document.getElementById("paginationWrap"),
      filtered.length, currentPage, PAGE_SIZE,
      function(p) { currentPage = p; render(); }
    );
  }

  window.openAddr = function(idx) {
    var o = filtered[idx];
    if (!o) return;
    document.getElementById("addrName").value = o.addr.name;
    document.getElementById("addrPhone").value = o.addr.phone;
    document.getElementById("addrAddr").value = o.addr.addr;
    document.getElementById("addrAddr2").value = o.addr.addr2;
    document.getElementById("addrModal").classList.add("is-open");
  };

  document.addEventListener("DOMContentLoaded", function() {
    renderStatusSummary();
    render();
    document.getElementById("searchBtn").addEventListener("click", applyFilter);
    document.getElementById("resetBtn").addEventListener("click", function() {
      ["fBrand","fSeller","fStatus"].forEach(function(id) { document.getElementById(id).value = ""; });
      ["fProduct","fOrderNo","fDateFrom","fDateTo"].forEach(function(id) { document.getElementById(id).value = ""; });
      applyFilter();
    });
    document.getElementById("selectAll").addEventListener("change", function() {
      document.querySelectorAll("#orderTableBody input[type=checkbox]").forEach(function(c) {
        c.checked = document.getElementById("selectAll").checked;
      });
    });
    function closeAddr() { document.getElementById("addrModal").classList.remove("is-open"); }
    document.getElementById("addrClose").addEventListener("click", closeAddr);
    document.getElementById("addrOverlay").addEventListener("click", closeAddr);
    document.getElementById("addrCancelBtn").addEventListener("click", closeAddr);
    document.getElementById("addrSaveBtn").addEventListener("click", function() {
      alert("배송지가 저장되었습니다."); closeAddr();
    });
    document.getElementById("batchStatusBtn").addEventListener("click", function() {
      var checked = document.querySelectorAll("#orderTableBody input[type=checkbox]:checked");
      if (!checked.length) { alert("변경할 주문을 선택해주세요."); return; }
      alert(checked.length + "건의 주문 상태를 변경합니다.\n(실제 구현 시 상태 선택 모달 연결)");
    });
  });
})();
</script>
</body>
</html>
