<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>매출 관리 — link it 어드민</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* === 페이지 전용 스타일 === */
.page-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
.page-header__title { font-size:20px; font-weight:500; color:var(--admin-heading); margin-bottom:6px; }
.page-header__sub { font-size:14px; color:var(--admin-muted); }

/* KPI 그리드 */
.ba-kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
@media(max-width:900px) { .ba-kpi-grid { grid-template-columns:repeat(2,1fr); } }
@media(max-width:480px) { .ba-kpi-grid { grid-template-columns:1fr 1fr; } }
.ba-kpi { background:var(--admin-white); border:1px solid var(--admin-stroke); border-radius:8px; padding:18px 16px; }
.ba-kpi__label { font-size:12px; font-weight:600; color:var(--admin-muted); margin-bottom:8px; }
.ba-kpi__value { font-size:19px; font-weight:700; color:var(--admin-heading); line-height:1.2; word-break:break-all; }
.ba-kpi__value--red   { color:#e83828; }
.ba-kpi__value--amber { color:#e67e22; }
.ba-kpi__value--green { color:#2e7d32; }
.ba-kpi__sub { font-size:12px; color:var(--admin-muted); margin-top:4px; }

/* 기간 버튼 그룹 */
.period-group { display:flex; border:1px solid var(--admin-border); border-radius:6px; overflow:hidden; }
.period-btn { padding:6px 12px; font-size:13px; border:none; border-right:1px solid var(--admin-border); background:var(--admin-white); color:var(--admin-muted); cursor:pointer; font-family:inherit; white-space:nowrap; transition:background .15s,color .15s; }
.period-btn:last-child { border-right:none; }
.period-btn.is-active { background:var(--admin-heading); color:#fff; font-weight:600; }

/* 단위 토글 */
.unit-toggle { display:flex; border:1px solid var(--admin-border); border-radius:6px; overflow:hidden; }
.unit-btn { padding:6px 16px; font-size:13px; border:none; border-right:1px solid var(--admin-border); background:var(--admin-white); color:var(--admin-muted); cursor:pointer; font-family:inherit; transition:background .15s,color .15s; }
.unit-btn:last-child { border-right:none; }
.unit-btn.is-active { background:var(--admin-heading); color:#fff; font-weight:600; }

/* 차트 */
.chart-wrap { padding:16px 20px 8px; }
.chart-inner { display:flex; gap:8px; }
.chart-y { display:flex; flex-direction:column-reverse; justify-content:space-between; height:168px; padding-bottom:28px; }
.chart-y-label { font-size:10px; color:var(--admin-muted); text-align:right; white-space:nowrap; }
.chart-plot { flex:1; min-width:0; }
.chart-bars { display:flex; align-items:flex-end; height:140px; border-left:2px solid var(--admin-stroke); border-bottom:2px solid var(--admin-stroke); padding:0 6px; gap:4px; }
.chart-col { flex:1; display:flex; flex-direction:column; align-items:center; }
.chart-bar { width:65%; border-radius:3px 3px 0 0; background:#3a6ac8; cursor:pointer; min-height:3px; transition:opacity .15s; }
.chart-bar:hover { opacity:.72; }
.chart-x-labels { display:flex; padding:5px 6px 0; gap:4px; }
.chart-x-label { flex:1; font-size:10px; color:var(--admin-muted); text-align:center; white-space:nowrap; overflow:hidden; }

/* 정산 계산식 */
.sett-formula { display:flex; align-items:stretch; border:1px solid var(--admin-stroke); border-radius:8px; overflow:hidden; margin-bottom:20px; }
.sett-formula__item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px 8px; gap:5px; background:#f7f9fc; border-right:1px solid var(--admin-stroke); text-align:center; min-width:0; }
.sett-formula__item--result { background:#eff6ff; border-right:none; }
.sett-formula__label { font-size:11px; font-weight:600; color:var(--admin-muted); line-height:1.3; }
.sett-formula__value { font-size:15px; font-weight:700; color:var(--admin-heading); line-height:1.2; word-break:break-all; }
.sett-formula__value--red  { color:#e83828; }
.sett-formula__value--blue { color:#3a6ac8; font-size:16px; }
.sett-formula__op { display:flex; align-items:center; justify-content:center; padding:0 6px; font-size:18px; font-weight:300; color:var(--admin-muted); background:var(--admin-white); flex-shrink:0; min-width:28px; }
@media(max-width:900px){
  .sett-formula { flex-direction:column; }
  .sett-formula__item { border-right:none; border-bottom:1px solid var(--admin-stroke); }
  .sett-formula__item--result { border-bottom:none; border-top:2px solid #3a6ac8; }
  .sett-formula__op { display:none; }
}


/* 판매 상태 배지 */
.prod-sale   { display:inline-flex;align-items:center;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border:1px solid #81c784;border-radius:4px;font-size:11px;font-weight:600; }
.prod-soldout{ display:inline-flex;align-items:center;padding:2px 8px;background:#f3f3f3;color:var(--admin-muted);border:1px solid #e0e0e0;border-radius:4px;font-size:11px;font-weight:600; }
.prod-closed { display:inline-flex;align-items:center;padding:2px 8px;background:#fff0ee;color:#e83828;border:1px solid #f5a090;border-radius:4px;font-size:11px;font-weight:600; }

/* 모달 정보 그리드 */
.modal-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 24px; margin-bottom:20px; }
.modal-info-label { font-size:11px; font-weight:600; color:var(--admin-muted); margin-bottom:3px; }
.modal-info-value { font-size:14px; font-weight:600; color:var(--admin-heading); }
.modal-info-value--red   { color:#e83828; }
.modal-info-value--blue  { color:#3a6ac8; }
.modal-info-value--amber { color:#e67e22; }

/* 정산 이력 */
.sett-history { border:1px solid var(--admin-stroke); border-radius:6px; overflow:hidden; }
.sett-history-row { display:flex; align-items:center; padding:9px 14px; gap:12px; border-bottom:1px solid var(--admin-stroke); font-size:13px; }
.sett-history-row:last-child { border-bottom:none; }
.sett-history-row:nth-child(even) { background:#fafbfd; }
.sett-history__date { color:var(--admin-muted); font-size:12px; flex-shrink:0; white-space:nowrap; }

/* 섹션 카드 헤더 */
.section-hd { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--admin-stroke); gap:12px; flex-wrap:wrap; }
.section-hd__left { display:flex; align-items:center; gap:14px; }
.sec-tabs { display:flex; gap:0; border-bottom:none; }
.sec-tab { padding:5px 14px; font-size:13px; font-weight:500; color:var(--admin-muted); border:none; background:none; cursor:pointer; font-family:inherit; border-bottom:2px solid transparent; transition:color .15s,border-color .15s; white-space:nowrap; }
.sec-tab:hover { color:var(--admin-text); }
.sec-tab.is-active { color:var(--admin-heading); border-bottom-color:var(--admin-heading); font-weight:600; }

/* 토스트 */
.ba-toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(10px); background:rgba(40,49,80,.92); color:#fff; padding:10px 22px; border-radius:6px; font-size:14px; z-index:9999; opacity:0; transition:opacity .25s,transform .25s; pointer-events:none; white-space:nowrap; }
.ba-toast.is-visible { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

  function showToast(msg) {

  function renderChart(data) {
    var max = Math.max.apply(null, data.map(function (d) { return d.sales; }));

    var barsEl = document.getElementById("chartBars");
    var xlabelsEl = document.getElementById("chartXLabels");

      return '<div class="chart-y-label">' + (v >= 1000000 ? (v / 10000) + "만" : v.toLocaleString()) + '</div>';
    }).join("");

    barsEl.innerHTML = data.map(function (d) {
      var h = max > 0 ? Math.max(3, Math.round((d.sales / max) * 136)) : 3;

      return '<div class="chart-col"><div class="chart-bar" style="height:' + h + 'px;" title="' + tip + '"></div></div>';

      return '<div class="chart-x-label">' + d.label + '</div>';
    }).join("");
  }

    var isMonthly = currentUnit === "monthly";
    document.getElementById("chartTableHead").innerHTML =
      '<tr><th>' + (isMonthly ? "월" : "날짜") + '</th>' +
      '<th style="text-align:center;">주문수</th>' +
      '<th class="text-right">판매금액</th>' +
      '<th class="text-right">취소 / 환불</th>' +
      '<th class="text-right">실입금금액</th>' +
      '<th class="text-right">PG 수수료</th>' +
      '<th class="text-right">정산 후 잔액</th></tr>';

    document.getElementById("chartTableBody").innerHTML = data.map(function (d) {
      var pg       = -Math.round(d.sales * 0.03);
      var cancel   = d.cancel || 0;
      var realRecv = d.sales + pg;          // 실입금금액
      var sellerFee = -Math.round(d.sales * 0.09);
      var remain   = realRecv + sellerFee + cancel; // 정산 후 잔액
      return '<tr>' +
        '<td style="font-weight:600;">' + d.label + '</td>' +
        '<td style="text-align:center;">' + d.orders + '건</td>' +
        '<td class="text-right">' + fc(d.sales) + '</td>' +
        '<td class="text-right" style="color:#e83828;">' + (cancel < 0 ? fc(cancel) : '—') + '</td>' +
        '<td class="text-right">' + fc(realRecv) + '</td>' +
        '<td class="text-right" style="color:#e83828;">' + fc(pg) + '</td>' +
        '<td class="text-right" style="font-weight:600;">' + fc(remain) + '</td>' +
      '</tr>';
    }).join("");
  }

  function updateChart() {
    var data = currentUnit === "monthly" ? MONTHLY : DAILY;
    renderChart(data);
    renderChartTable(data);
  }

  /* ─── Products ─── */
  function renderProducts() {
    document.getElementById("productBody").innerHTML = PRODUCTS_DATA.map(function (p, idx) {
      return '<tr>' +
        '<td style="font-weight:600;">' + p.name + '</td>' +
        '<td style="text-align:center;">' + prodBadge(p.status) + '</td>' +
        '<td style="text-align:center;">' + p.orders + '건</td>' +
        '<td style="text-align:center;">' + p.qty + '개</td>' +
        '<td class="text-right">' + fc(p.sales) + '</td>' +
        '<td class="text-right" style="color:#e83828;">' + (p.cancel < 0 ? fc(p.cancel) : "—") + '</td>' +
        '<td class="text-right" style="color:#e83828;">' + fc(p.pg) + '</td>' +
        '<td class="text-right">' + fc(p.realRecv) + '</td>' +
        '<td class="text-right" style="font-weight:600;">' + fc(p.sett) + '</td>' +
        '<td style="text-align:center;">' +
          '<button class="admin-btn admin-btn--outline admin-btn--xs prod-detail-btn" data-idx="' + idx + '">상세</button>' +
        '</td>' +
      '</tr>';
    }).join("");

    document.querySelectorAll(".prod-detail-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { openProductModal(parseInt(btn.dataset.idx)); });
    });
  }

  /* ─── Modals ─── */
  function openProductModal(idx) {
    var p = PRODUCTS_DATA[idx];
    document.getElementById("productModalTitle").textContent = p.name + " — 매출 상세";
    document.getElementById("productModalInfo").innerHTML =
      infoRow("상품명", p.name) +
      infoRow("판매 상태", p.status) +
      infoRow("주문수", p.orders + "건") +
      infoRow("판매수량", p.qty + "개") +
      infoRow("판매금액", fc(p.sales)) +
      infoRow("취소 / 환불", p.cancel < 0 ? fc(p.cancel) : "—", p.cancel < 0 ? "#e83828" : null) +
      infoRow("실입금금액", fc(p.realRecv)) +
      infoRow("PG 수수료", fc(p.pg), "#e83828") +
      infoRow("정산 후 잔액", fc(p.sett), "#3a6ac8");

    document.getElementById("productModalOrders").innerHTML = p.detail.map(function (o) {
      return '<tr>' +
        '<td style="font-size:12px;">' + o.no + '</td>' +
        '<td style="font-size:12px;">' + o.date + '</td>' +
        '<td>' + o.seller + '</td>' +
        '<td class="text-right">' + fc(o.amt) + '</td>' +
        '<td class="text-right" style="color:#e83828;">' + fc(o.pg) + '</td>' +
        '<td class="text-right" style="font-weight:600;">' + fc(o.sett) + '</td>' +
      '</tr>';
    }).join("");

    document.getElementById("productModal").classList.add("is-open");
  }

  /* ─── Event Binding ─── */
  document.addEventListener("DOMContentLoaded", function () {
    updateChart();
    renderProducts();

    /* 매출 관리 탭 */
    document.querySelectorAll("#salesTabs .sec-tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        document.querySelectorAll("#salesTabs .sec-tab").forEach(function (t) { t.classList.remove("is-active"); });
        tab.classList.add("is-active");
        ["s-overview", "s-product"].forEach(function (id) {
          document.getElementById(id).style.display = "none";
        });
        document.getElementById(tab.dataset.stab).style.display = "";
      });
    });

    /* Period buttons */
    document.querySelectorAll(".period-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".period-btn").forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        document.getElementById("customDateRange").style.display = btn.dataset.p === "custom" ? "" : "none";
      });
    });

    /* Unit toggle */
    document.querySelectorAll(".unit-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".unit-btn").forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        currentUnit = btn.dataset.unit;
        updateChart();
      });
    });

    /* Search / Reset */
    document.getElementById("searchBtn").addEventListener("click", function () {
      showToast("조회 조건이 적용되었습니다.");
    });
    document.getElementById("resetBtn").addEventListener("click", function () {
      document.querySelectorAll(".period-btn").forEach(function (b) { b.classList.remove("is-active"); });
      document.querySelector(".period-btn[data-p='month']").classList.add("is-active");
      document.getElementById("customDateRange").style.display = "none";
      document.getElementById("fSeller").value = "";
      document.getElementById("fProduct").value = "";
      showToast("필터가 초기화되었습니다.");
    });

    

    /* Product modal */
    document.getElementById("productModalOverlay").addEventListener("click", function () { closeModal("productModal"); });
    document.getElementById("productModalClose").addEventListener("click", function () { closeModal("productModal"); });
    document.getElementById("productModalCloseBtn").addEventListener("click", function () { closeModal("productModal"); });
    document.getElementById("productModalDownload").addEventListener("click", function () { showToast("다운로드 준비 중입니다."); });

    /* ESC */
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { closeModal("productModal"); }
    });
  });
})();
</script>
</body>
</html>
