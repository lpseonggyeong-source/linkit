<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - 링크잇</title>
  <meta name="description" content="링크잇 로그인 페이지" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-wrapper">

    <!-- 헤더 (빨간 패널 위 오버레이) -->
    <header class="auth-header auth-header--on-red">
      <div class="auth-header__inner">
        <a class="auth-header__logo" href="index.html" aria-label="링크잇 홈">
          <img src="assets/logo.png" alt="링크잇" />
        </a>
        <nav class="auth-header__nav" aria-label="주요 메뉴">
          <a href="#service">서비스</a>
          <a href="#features">기능</a>
          <a href="#benefits">혜택</a>
          <a href="#contact">상담</a>
        </nav>
        <div class="auth-header__btns">
          <a class="auth-btn auth-btn--ghost" href="login.html" aria-current="page">로그인</a>
        </div>
      </div>
    </header>

    <div class="login-layout">

      <!-- 왼쪽: 브랜드 패널 -->
      <div class="login-brand">
        <img class="login-brand__bg" src="assets/banner-bg.png" alt="" aria-hidden="true" />
        <img class="login-brand__logo" src="assets/logo.png" alt="링크잇" />
        <div class="login-brand__text">
          <p class="login-brand__title1">링크가 상점이 되는 공간</p>
          <p class="login-brand__title2">링크잇</p>
        </div>
        <p class="login-brand__desc">
          상품 등록부터 주문, 결제, 고객관리까지!<br />
          링크잇 하나로 온라인 판매를 시작하세요.
        </p>
      </div>

      <!-- 오른쪽: 로그인 폼 -->
      <div class="login-form-area">
        <div class="login-form-wrap">
          <h1 class="login-form__title">로그인</h1>
          <form
            class="login-fields"
            onsubmit="window.location.href='login-success.html'; return false;"
            novalidate
          >
            <div class="login-field">
              <label for="login-id">아이디</label>
              <input
                id="login-id"
                type="text"
                name="username"
                placeholder="linkit01010"
                autocomplete="username"
              />
            </div>
            <div class="login-field">
              <label for="login-pw">비밀번호</label>
              <input
                id="login-pw"
                type="password"
                name="password"
                placeholder="••••••••••••"
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="login-submit">로그인</button>
            <a href="#" class="login-forgot">Forgot password?</a>
          </form>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
