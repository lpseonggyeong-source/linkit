<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상점 생성 — link it 어드민</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    /* 완료 모달 */
    .sc-complete-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      align-items: center;
      justify-content: center;
    }
    .sc-complete-modal.is-open { display: flex; }
    .sc-complete-modal__overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.55);
    }
    .sc-complete-modal__box {
      position: relative;
      background: #fff;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      padding: 40px 32px 32px;
      text-align: center;
      z-index: 1;
    }
    .sc-complete-modal__icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--admin-red);
    }
    .sc-complete-modal__title {
      font-size: 18px;
      font-weight: 700;
      color: var(--admin-heading);
      margin-bottom: 8px;
    }
    .sc-complete-modal__desc {
      font-size: 14px;
      color: var(--admin-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
  </style>
</head>
<body class="store-create-step5">

<header class="admin-mobile-header">
  <span class="admin-mobile-header__logo">link it</span>
  <button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기">
    <span></span><span></span><span></span>
  </button>
</header>
<div class="admin-overlay" id="adminOverlay"></div>

<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <h1 class="admin-page-title t-title-1-md">상점 생성</h1>

    <!-- 스텝바 -->
    <div class="admin-store-stepbar" aria-label="상점 생성 단계">
      <span class="admin-store-step-btn is-done">
        <span class="admin-store-step-btn__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </span>
        <span>기본정보 입력</span>
      </span>
      <span class="admin-store-step-btn is-done">
        <span class="admin-store-step-btn__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        </span>
        <span>디자인 템플릿 선택</span>
      </span>
      <span class="admin-store-step-btn is-done">
        <span class="admin-store-step-btn__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/></svg>
        </span>
        <span>섹션 설정</span>
      </span>
      <span class="admin-store-step-btn is-done">
        <span class="admin-store-step-btn__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </span>
        <span>내 상품 진열</span>
      </span>
      <span class="admin-store-step-btn is-active" aria-current="step">
        <span class="admin-store-step-btn__icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span>상점 생성</span>
      </span>
    </div>

    <!-- 콘텐츠 -->
    <div class="admin-store-step-panel is-active">
      <div class="admin-card product-section">
        <div class="admin-card__header">
          <span class="admin-card__title">상점 생성 확인</span>
        </div>
        <div class="admin-card__body">
          <p class="t-body-3-rg admin-text-muted" style="margin-bottom:20px;">
            아래 내용을 확인하고 상점을 생성하세요.
          </p>

          <!-- [BACKEND] 요약 정보는 백엔드 연동 시 이전 단계 입력값을 기반으로 동적 렌더링됩니다 -->
          <div style="display:flex;flex-direction:column;gap:16px;">
            <div class="admin-settings-info-row">
              <span class="admin-settings-info-label" style="width:120px;">상점 이름</span>
              <span class="admin-settings-info-value t-body-2-rg admin-text-muted">(입력값)</span>
            </div>
            <div class="admin-settings-info-row">
              <span class="admin-settings-info-label" style="width:120px;">템플릿</span>
              <span class="admin-settings-info-value t-body-2-rg admin-text-muted">(선택한 템플릿)</span>
            </div>
            <div class="admin-settings-info-row" style="align-items:flex-start;">
              <span class="admin-settings-info-label" style="width:120px;padding-top:2px;">섹션 구성</span>
              <ul style="margin:0;padding:0;list-style:none;">
                <li style="margin-bottom:4px;font-size:14px;color:var(--admin-muted);">오늘의 라이브쇼핑</li>
                <li style="margin-bottom:4px;font-size:14px;color:var(--admin-muted);">전체 상품</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 이동 버튼 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
      <a href="store-create-step4.html" class="admin-btn admin-btn--outline">이전</a>
      <!-- [BACKEND] 상점 생성 버튼 클릭 시 POST /api/stores 후 store-list.html로 이동 -->
      <button type="button" id="scCreateBtn" class="admin-btn admin-btn--primary">상점 생성</button>
    </div>

  </main>
</div>

<!-- 상점 생성 완료 모달 -->
<div class="sc-complete-modal" id="scCompleteModal" role="dialog" aria-modal="true" aria-labelledby="scCompleteTitle">
  <div class="sc-complete-modal__overlay"></div>
  <div class="sc-complete-modal__box">
    <div class="sc-complete-modal__icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <p class="sc-complete-modal__title" id="scCompleteTitle">상점이 생성되었습니다!</p>
    <p class="sc-complete-modal__desc">상점이 성공적으로 생성되었습니다.<br>상점 목록에서 확인하세요.</p>
    <a href="store-list.html" class="admin-btn admin-btn--primary" style="width:100%;justify-content:center;">상점 목록으로 이동</a>
  </div>
</div>

<script src="admin.js"></script>
<script>
(function () {
  var createBtn = document.getElementById("scCreateBtn");
  var modal     = document.getElementById("scCompleteModal");

  createBtn.addEventListener("click", function () {
    modal.classList.add("is-open");
  });
}());
</script>
</body>
</html>
