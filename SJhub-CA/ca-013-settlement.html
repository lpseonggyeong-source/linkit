<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지사 정산 — SJ Hub CA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="shared.css" />
</head>
<body data-settlement-mode="list" data-settlement-type="branch">
<header class="admin-mobile-header"><span class="admin-mobile-header__logo">SJ Hub</span><button class="admin-hamburger" id="adminHamburger" aria-label="메뉴 열기"><span></span><span></span><span></span></button></header>
<div class="admin-overlay" id="adminOverlay"></div>
<div class="admin-layout">
  <aside class="admin-sidebar" id="adminSidebar" data-role="ca"></aside>
  <main class="admin-main settlement-page settlement-page--wide">
    <h1 class="admin-page-title" id="pageTitle">지사 정산</h1>
    <div class="settlement-section-title">오늘의 정산 정보</div>
    <div class="settlement-kpi-grid" id="settlementKpiGrid"></div>

    <div class="settlement-filter-line">
      <label>조회 기간</label>
      <input type="datetime-local" id="fFrom" value="2026-07-07T00:00" aria-label="조회 시작일시" />
      <span>~</span>
      <input type="datetime-local" id="fTo" value="2026-07-07T23:59" aria-label="조회 종료일시" />
      <select id="fTimeUnit"><option>일별</option><option>주별</option><option>월별</option></select>
      <input type="text" id="fName" placeholder="지사명" />
      <select id="fStatus"><option value="">정산상태 전체</option><option>정산 필요</option><option>정산대기</option><option>정산중</option><option>정산 완료</option><option>정산 보류</option></select>
      <button type="button" class="admin-btn admin-btn--primary admin-btn--sm" id="searchBtn">검색</button>
      <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="resetBtn">초기화</button>
    </div>

    <div class="settlement-section-title" id="tableSectionTitle">지사별 정산</div>
    <div class="settlement-actions-line">
      <div class="settlement-actions-line__left">
        <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="selectAllBtn">전체 선택</button>
        <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="bulkStatusBtn">선택항목 상태 변경</button>
      </div>
      <div class="settlement-actions-line__right">
        <select class="admin-filter-select" id="pageSize"><option>5</option><option selected>10</option><option>20</option></select>
        <button type="button" class="admin-btn admin-btn--outline admin-btn--sm" id="downloadBtn">엑셀 다운로드</button>
      </div>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table settlement-table">
        <thead><tr><th><input type="checkbox" aria-label="전체 선택" /></th><th id="nameHeader">명칭</th><th><button type="button" class="admin-sort-btn" data-sort="fee">수수료율</button></th><th class="text-right"><button type="button" class="admin-sort-btn" data-sort="sales">총 판매금액</button></th><th>정산 건수</th><th class="text-right"><button type="button" class="admin-sort-btn" data-sort="amount">정산 금액</button></th><th>정산 상태</th><th>상세 내역</th></tr></thead>
        <tbody id="settlementTableBody"></tbody>
      </table>
    </div>
    <div class="admin-empty-state" id="emptyState" style="display:none;">조회된 정산 데이터가 없습니다.</div>
    <div class="admin-pagination" id="paginationWrap"></div>
  </main>
</div>
<script src="shared.js"></script>
<script src="settlement-pages.js"></script>
</body>
</html>
