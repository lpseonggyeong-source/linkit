<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 완료 - 링크잇</title>
  <meta name="description" content="링크잇 로그인이 완료되었습니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 헤더 (흰 배경) -->
  <header class="auth-header auth-header--on-white">
    <div class="auth-header__inner">
      <a class="auth-header__logo" href="index.html" aria-label="링크잇 홈">
        <img src="assets/logo.png" alt="링크잇" />
      </a>
      <nav class="auth-header__nav" aria-label="주요 메뉴">
        <a href="#service">서비스</a>
        <a href="#features">기능</a>
        <a href="#benefits">혜택</a>
        <a href="#contact">상담</a>
      </nav>
      <div class="auth-header__btns">
        <a class="auth-btn auth-btn--outline" href="login.html">로그인</a>
      </div>
    </div>
  </header>

  <main class="success-content">

    <!-- 완료 메시지 -->
    <div class="success-message">
      <svg class="success-icon" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="26" cy="26" r="26" fill="#22C55E" />
        <path d="M14 27L22 35L38 18" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="success-title-group">
        <h1 class="success-title">로그인 완료!</h1>
        <p class="success-desc">지금 바로 내 상품을 판매해보세요!</p>
      </div>
    </div>

    <!-- 3단계 카드 -->
    <div class="success-steps" role="list" aria-label="시작 3단계">

      <!-- 카드 1: 상품 등록 -->
      <div class="success-card" role="listitem">
        <div class="success-card__inner">
          <span class="success-card__num" aria-hidden="true">1</span>
          <div class="success-card__body">
            <div class="success-card__head">
              <img class="success-card__icon" src="assets/icon_bag.svg" alt="" aria-hidden="true" />
              <span class="success-card__name">상품 등록</span>
            </div>
            <p class="success-card__desc">상품을 등록하면 자동으로 판매페이지가 만들어져요!</p>
          </div>
        </div>
      </div>

      <!-- 화살표 -->
      <svg class="success-chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path d="M9 18L15 12L9 6" stroke="#5f5f5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>

      <!-- 카드 2: 링크 생성 -->
      <div class="success-card" role="listitem">
        <div class="success-card__inner">
          <span class="success-card__num" aria-hidden="true">2</span>
          <div class="success-card__body">
            <div class="success-card__head">
              <img class="success-card__icon" src="assets/icon-link.svg" alt="" aria-hidden="true" />
              <span class="success-card__name">링크 생성</span>
            </div>
            <p class="success-card__desc">만들어진 판매페이지를 확인하고 생성된 링크를 복사해서 사용하세요.</p>
          </div>
        </div>
      </div>

      <!-- 화살표 -->
      <svg class="success-chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path d="M9 18L15 12L9 6" stroke="#5f5f5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>

      <!-- 카드 3: 판매&관리 -->
      <div class="success-card" role="listitem">
        <div class="success-card__inner">
          <span class="success-card__num" aria-hidden="true">3</span>
          <div class="success-card__body">
            <div class="success-card__head">
              <img class="success-card__icon" src="assets/icon-arrow.svg" alt="" aria-hidden="true" />
              <span class="success-card__name">판매&amp;관리</span>
            </div>
            <p class="success-card__desc">업로드가 끝나면 바로 판매를 시작할 수 있어요. 관리자페이지에서 내 링크와 매출을 관리하세요.</p>
          </div>
        </div>
      </div>

    </div>

    <!-- CTA 버튼 -->
    <a class="success-cta" href="#">상품 등록하러 가기</a>

  </main>

</body>
</html>
